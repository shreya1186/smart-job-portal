<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

        <title>Company Dashboard</title>

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

        <link rel="stylesheet" href="css/global.css">

        <link rel="stylesheet" href="css/dashboard.css">

    </head> 

    <body>

        <header class="dashboard-header">

        <div class="container dashboard-nav">

        <h2>🏢 Company Dashboard</h2>

        <div>

        <button id="theme-btn">

        <i class="fa-solid fa-moon"></i>

        </button>

        

        <button
        class="btn btn-outline"
        id="logoutBtn">

        Logout

        </button>

        </div>

        </div>

        </header>

        <section class="dashboard">

            <div class="container">

                <div class="cards">

                    <div class="dashboard-card">

                        <h3>Jobs Posted</h3>

                        <h1 id="jobsPosted">0</h1>

                    </div>

                    <div class="dashboard-card">

                        <h3>Applications Received</h3>

                        <h1 id="applicationsReceived">0</h1>

                    </div>

                    <div class="dashboard-card">

                        <h3>Open Jobs</h3>

                        <h1 id="openJobs">0</h1>

                    </div>

                </div>

                <br><br>


            <div style="margin-top:30px;display:flex;gap:15px;justify-content:center;flex-wrap:wrap;">

                <a href="post-job.html" class="btn btn-primary">
                    <i class="fa-solid fa-plus"> </i>
                    Post Job
                </a>

                <a href="company-jobs.html" class="btn btn-outline">
                    <i class="fa-solid fa-briefcase"></i>
                    My Jobs
                </a>

                <a href="company-profile.html" class="btn btn-outline">
                    <i class="fa-solid fa-building"></i>
                    Company Profile
                </a>

            </div>

            </section> 
            <script src="js/theme.js"></script>

            <script src="js/api.js"></script>

            <script src="js/auth.js"></script>

            <script src="js/company.js"></script>

    </body>

</html>
