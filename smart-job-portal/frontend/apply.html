<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Apply for Job</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="dashboard-header">

    <div class="container dashboard-nav">

        <h2>📝 Apply for Job</h2>

        <div>

            <button id="theme-btn" class="btn btn-outline">
                <i class="fa-solid fa-moon"></i>
            </button>

            <a href="jobs.html" class="btn btn-outline">
                Back
            </a>

        </div>

    </div>

</header>

<section class="dashboard">

    <div class="container">

        <form id="applyForm" class="dashboard-form">

            <div class="dashboard-card">

                <h2>Application</h2>

                <div class="form-group">

                    <label>Cover Letter</label>

                    <textarea
                        id="coverLetter"
                        rows="8"
                        placeholder="Introduce yourself, explain why you're interested in this role, and highlight your skills and experience..."
                        required></textarea>

                </div>

                <button
                    class="btn btn-primary"
                    type="submit">

                    <i class="fa-solid fa-paper-plane"></i>
                    Submit Application

                </button>

            </div>

        </form>

    </div>

</section>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/apply.js"></script>

</body>

</html>
