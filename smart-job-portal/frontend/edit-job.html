<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Edit Job</title>

        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/dashboard.css">

        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    </head>

    <body>

        <header class="dashboard-header">

            <div class="container dashboard-nav">

                <h2>✏ Edit Job</h2>

                <div>

                    <button id="theme-btn" class="btn btn-outline">
                        <i class="fa-solid fa-moon"></i>
                    </button>

                    <a href="company-jobs.html"
                    class="btn btn-outline">

                        Back

                    </a>

                </div>

            </div>

        </header>

        <section class="dashboard">

            <div class="container">

                <div class="dashboard-card">

                    <form id="editJobForm" class="dashboard-form">

                        <div class="form-group">

                            <label>Job Title</label>

                            <input
                                type="text"
                                id="title"
                                required>

                        </div>

                        <div class="form-group">

                            <label>Description</label>

                            <textarea
                                id="description"
                                required></textarea>

                        </div>

                        <div class="form-group">

                            <label>Salary</label>

                            <input
                                type="number"
                                id="salary"
                                required>

                        </div>

                        <div class="form-group">

                            <label>Location</label>

                            <input
                                type="text"
                                id="location"
                                required>

                        </div>

                        <div class="form-group">

                            <label>Experience</label>

                            <input
                                type="text"
                                id="experience"
                                required>

                        </div>

                        <div class="form-group">

                            <label>Skills</label>

                            <input
                                type="text"
                                id="skills"
                                required>

                        </div>

                        <div class="form-group">

                            <label>Deadline</label>

                            <input
                                type="date"
                                id="deadline"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Update Job

                        </button>

                    </form>

                </div>

            </div>

        </section>

        <script src="js/theme.js"></script>
        <script src="js/api.js"></script>
        <script src="js/edit-job.js"></script>

    </body>

</html>
