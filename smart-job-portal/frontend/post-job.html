<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Post Job</title>

        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/dashboard.css">
        <link rel="stylesheet"
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    </head>

    <body>

        <header class="dashboard-header">

        <div class="container dashboard-nav">

        <h2>➕ Post New Job</h2>

        <div>

            <button id="theme-btn" class="btn btn-outline">
                <i class="fa-solid fa-moon"></i>
            </button>

            <a href="company.html" class="btn btn-outline">
                Dashboard
            </a>
        </div>

        </div>

        </header>

        <section class="dashboard">

        <div class="container">
        <form id="jobForm" class="dashboard-form">

            <div class="dashboard-card">

                <h2>Job Information</h2>
                <br>

                <div class="form-group">
                    <label>Job Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Enter Job Title"
                        required>
                </div>

                <div class="form-group">
                    <label>Job Description</label>
                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Describe the job role..."
                        required></textarea>
                </div>

                <div class="form-group">
                    <label>Salary (₹)</label>
                    <input
                        type="number"
                        id="salary"
                        placeholder="Example: 600000"
                        required>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input
                        type="text"
                        id="location"
                        placeholder="Ahmedabad"
                        required>
                </div>

                <div class="form-group">
                    <label>Experience</label>
                    <input
                        type="text"
                        id="experience"
                        placeholder="0-2 Years"
                        required>
                </div>

                <div class="form-group">
                    <label>Required Skills</label>
                    <input
                        type="text"
                        id="skills"
                        placeholder="Java, Spring Boot, MySQL"
                        required>
                </div>

                <div class="form-group">
                    <label>Application Deadline</label>
                    <input
                        type="date"
                        id="deadline"
                        required>
                </div>

                <button
                    class="btn btn-primary"
                    type="submit">

                    <i class="fa-solid fa-paper-plane"></i>
                    Post Job

                </button>

            </div>

        </form>

        </div>

        </section>
        <script src="js/theme.js"></script>
        <script src="js/api.js"></script>
        <script src="js/post-job.js"></script>

    </body>

</html>
